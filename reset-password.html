<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Life Assistant - Reset Password</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>

</head>

<body>

    <main class="authPage">

        <section class="authCard">

            <div class="authLogo">🤖</div>

            <h1>AI Life Assistant</h1>

            <p class="authSubtitle">
                Create a new password
            </p>

            <form id="resetPasswordForm">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter your new password"
                    autocomplete="new-password"
                    required
                >

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your new password"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="submit"
                    class="primaryAuthButton"
                >
                    Update Password
                </button>

            </form>

            <p id="resetMessage"></p>

        </section>

    </main>


<script>

const resetForm =
    document.getElementById("resetPasswordForm");

const newPassword =
    document.getElementById("newPassword");

const confirmPassword =
    document.getElementById("confirmPassword");

const resetMessage =
    document.getElementById("resetMessage");


function showResetMessage(message, error = false) {

    resetMessage.textContent = message;

    resetMessage.style.color =
        error ? "#ef4444" : "#22c55e";

}


resetForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const password =
        newPassword.value;

    const confirm =
        confirmPassword.value;


    if (password.length < 6) {

        showResetMessage(
            "Password must be at least 6 characters.",
            true
        );

        return;
    }


    if (password !== confirm) {

        showResetMessage(
            "Passwords do not match.",
            true
        );

        return;
    }


    showResetMessage(
        "Updating your password..."
    );


    const { error } =
        await window.supabaseClient.auth.updateUser({
            password: password
        });


    if (error) {

        console.error(
            "❌ Password update error:",
            error
        );

        showResetMessage(
            error.message,
            true
        );

        return;
    }


    showResetMessage(
        "✅ Password updated successfully."
    );


    setTimeout(() => {

        window.location.href =
            "auth.html";

    }, 1500);

});

</script>

</body>

</html>
