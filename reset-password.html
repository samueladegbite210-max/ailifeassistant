<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Life Assistant - Reset Password</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>

</head>

<body>

    <main class="authPage">

        <section class="authCard">

            <div class="authLogo">🤖</div>

            <h1>AI Life Assistant</h1>

            <p class="authSubtitle">
                Create a new password
            </p>

            <form id="resetPasswordForm">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter your new password"
                    autocomplete="new-password"
                    required
                >

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your new password"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="submit"
                    class="primaryAuthButton"
                >
                    Update Password
                </button>

            </form>

            <p id="resetMessage"></p>

        </section>

    </main>


<script>
const resetForm = document.getElementById("resetPasswordForm");
const newPassword = document.getElementById("newPassword");
const confirmPassword = document.getElementById("confirmPassword");
const resetMessage = document.getElementById("resetMessage");

let sessionReady = false;

function showResetMessage(message, error = false) {
    resetMessage.textContent = message;
    resetMessage.style.color = error ? "#ef4444" : "#22c55e";
}

async function prepareResetSession() {
    const supabase = window.supabaseClient;

    if (!supabase) {
        showResetMessage(
            "Unable to connect to the authentication service. Please refresh the page.",
            true
        );
        return;
    }

    try {
        showResetMessage("Verifying your password reset link...");

        const url = new URL(window.location.href);
        const code = url.searchParams.get("code");

        // Handle password-reset links using the PKCE flow.
        if (code) {
            const { error } =
                await supabase.auth.exchangeCodeForSession(code);

            if (error) {
                console.error("Password reset session error:", error);
            }
        }

        // Handle links that return session tokens in the URL hash.
        const hashParams = new URLSearchParams(
            window.location.hash.substring(1)
        );

        const accessToken = hashParams.get("access_token");
        const refreshToken = hashParams.get("refresh_token");
        const authError = hashParams.get("error_description");

        if (authError) {
            showResetMessage(
                "Your reset link could not be verified. Request a new password reset email.",
                true
            );
            return;
        }

        if (accessToken && refreshToken) {
            const { error } = await supabase.auth.setSession({
                access_token: accessToken,
                refresh_token: refreshToken
            });

            if (error) {
                console.error("Password reset token error:", error);
            }
        }

        // Confirm that Supabase now has an authenticated session.
        const { data, error } = await supabase.auth.getSession();

        if (error) {
            console.error("Session check error:", error);
        }

        if (!data?.session) {
            showResetMessage(
                "Your reset link is invalid or has expired. Please request a new password reset email.",
                true
            );
            return;
        }

        sessionReady = true;

        showResetMessage("Your reset link is verified. You can set your new password.");

    } catch (error) {
        console.error("Reset session error:", error);

        showResetMessage(
            "Unable to verify your reset link. Please request a new one.",
            true
        );
    }
}

resetForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!sessionReady) {
        showResetMessage(
            "Your reset link has not been verified. Please wait or request a new link.",
            true
        );
        return;
    }

    const password = newPassword.value;
    const confirm = confirmPassword.value;

    if (password.length < 6) {
        showResetMessage(
            "Password must be at least 6 characters.",
            true
        );
        return;
    }

    if (password !== confirm) {
        showResetMessage("Passwords do not match.", true);
        return;
    }

    showResetMessage("Updating your password...");

    try {
        const { error } = await window.supabaseClient.auth.updateUser({
            password: password
        });

        if (error) {
            console.error("Password update error:", error);

            showResetMessage(error.message, true);
            return;
        }

        showResetMessage(
            "Password updated successfully! Redirecting to sign in..."
        );

        setTimeout(async () => {
            await window.supabaseClient.auth.signOut();
            window.location.href = "auth.html";
        }, 2000);

    } catch (error) {
        console.error("Password update exception:", error);

        showResetMessage(
            "Something went wrong. Please try again.",
            true
        );
    }
});

prepareResetSession();
</script>

</body>

</html>
