<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>AI Life Assistant - Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ==========================
HEADER
========================== -->
<header class="chatHeader">
    <h1>🤖 AI Life Assistant</h1>
</header>
<!-- ==========================
CHAT
========================== -->
<main class="chatPage">
    <div
        id="chatBox"
        class="chatBox">
        <!-- Welcome message -->
        <div class="message ai">
            <div class="messageText">
                👋 Hello Samuel!
                <br><br>
                How can I help you today?
            </div>
            <div class="messageTime">
                Now
            </div>
        </div>
    </div>
</main>
<!-- ==========================
COMPOSER
========================== -->
<footer class="chatComposer">
    <button
        id="attachBtn"
        class="composerIcon">
        +
    </button>
    <textarea
        id="userInput"
        rows="1"
        placeholder="Ask AI Life Assistant...">
    </textarea>
    <button
        id="voiceBtn"
        class="composerIcon">
        🎤
    </button>
    <button
        id="sendBtn"
        class="sendButton">
        ➤
    </button>
</footer>
<!-- ==========================
ATTACHMENT MENU
========================== -->
<div
    id="attachmentMenu"
    class="attachmentMenu">
    <button onclick="pickImage()">
        🖼️ Photo
    </button>
    <button onclick="takePhoto()">
        📷 Camera
    </button>
    <button onclick="pickFile()">
        📄 File
    </button>
</div>
<!-- Hidden Inputs -->
<input
type="file"
id="imagePicker"
accept="image/*"
style="display:none;">
<input
type="file"
id="filePicker"
style="display:none;">
<!-- ==========================
BOTTOM NAVIGATION
========================== -->
<nav class="navbar">
<a href="dashboard.html">
🏠<br>Home
</a>
<a href="chat.html">
🤖<br>AI
</a>
<a href="notes.html">
📝<br>Notes
</a>
<a href="calendar.html">
📅<br>Calendar
</a>
<a href="profile.html">
👤<br>Profile
</a>
</nav>

AI ENGINE
========================== -->
