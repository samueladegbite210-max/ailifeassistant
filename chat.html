<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Life Assistant - Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ==========================================
     HEADER
========================================== -->
<header class="chatHeader">
    <h1>🤖 AI Life Assistant</h1>
</header>


<!-- ==========================================
     CHAT AREA
========================================== -->
<main class="chatPage">

    <div id="chatBox" class="chatBox">

        <div class="message ai" id="welcomeMessage">

            <div class="messageText">
                👋 Hello <span id="welcomeName">Samuel</span>!
                <br><br>
                How can I help you today?
            </div>

            <div class="messageTime">
                Now
            </div>

        </div>

    </div>

</main>


<!-- ==========================================
     CHAT COMPOSER
========================================== -->
<footer class="chatComposer">

    <button
        type="button"
        id="attachBtn"
        class="composerIcon"
        aria-label="Attach"
    >
        +
    </button>


    <textarea
        id="userInput"
        rows="1"
        placeholder="Ask AI Life Assistant..."
        autocomplete="off"
    ></textarea>


    <button
        type="button"
        id="voiceBtn"
        class="composerIcon"
        aria-label="Voice"
    >
        🎤
    </button>


    <button
        type="button"
        id="sendBtn"
        class="sendButton"
        aria-label="Send message"
    >
        ➤
    </button>

</footer>


<!-- ==========================================
     ATTACHMENT MENU
========================================== -->
<div id="attachmentMenu" class="attachmentMenu">


    <button type="button" id="pickImageBtn">
        🖼️ Photo
    </button>

    <button type="button" id="takePhotoBtn">
        📷 Camera
    </button>

    <button type="button" id="pickFileBtn">
        📄 File
    </button>

</div>


<!-- ==========================================
     HIDDEN FILE INPUTS
========================================== -->

<input
    type="file"
    id="imagePicker"
    accept="image/*"
    hidden
>

<input
    type="file"
    id="cameraPicker"
    accept="image/*"
    capture="environment"
    hidden
>

<input
    type="file"
    id="filePicker"
    accept=".txt,.pdf,.doc,.docx,.csv,.json,.js,.css,.html,.md"
    hidden
>


<!-- ==========================================
     BOTTOM NAVIGATION
========================================== -->
<nav class="navbar">

    <a href="dashboard.html">
        🏠<br>Home
    </a>

    <a href="chat.html" class="active">
        🤖<br>AI
    </a>

    <a href="notes.html">
        📝<br>Notes
    </a>

    <a href="calendar.html">
        📅<br>Calendar
    </a>

    <a href="profile.html">
        👤<br>Profile
    </a>

</nav>


<!-- ==========================================
     AI ENGINE
========================================== -->

<script src="js/helpers.js?v=2"></script>
<script src="js/conversation.js?v=2"></script>
<script src="js/knowledge.js?v=2"></script>
<script src="js/calculator.js?v=2"></script>
<script src="js/datetime.js?v=2"></script>

<script src="js/goals.js?v=2"></script>

<script src="js/events.js?v=2"></script>
<script src="js/natural.js?v=2"></script>
<script src="js/weather.js?v=2"></script>
<script src="js/search.js?v=2"></script>
<script src="js/memory.js?v=2"></script>
<script src="js/learnUser.js?v=2"></script>
<script src="js/brain.js?v=2"></script>

<!-- ==========================================
     EXTERNAL AI / DOCUMENT LIBRARIES
========================================== -->

<!-- PDF.js -->

        type="module">
</script>

     ATTACHMENT + CHAT CONTROLLERS
========================================== -->

<script src="attachmentAI.js?v=3"></script>

<script src="js/smartAI.js?v=7"></script>
<script src="js/chat.js?v=7"></script>

<!-- ==========================================
     WELCOME NAME
========================================== -->

<script>
document.addEventListener("DOMContentLoaded", () => {

    const button = document.getElementById("sendBtn");
    const input = document.getElementById("userInput");

    console.log("===== CHAT DEBUG =====");
    console.log("sendBtn:", button);
    console.log("userInput:", input);
    console.log("sendMessage:", typeof sendMessage);
    console.log("aiReply:", typeof aiReply);
    console.log("smartAIReply:", typeof smartAIReply);
    console.log("conversationReply:", typeof conversationReply);
    console.log("memoryReply:", typeof memoryReply);

    if (button) {

        button.addEventListener("click", async function () {

            console.log("1️⃣ SEND BUTTON CLICKED");

            console.log(
                "2️⃣ Input value:",
                input ? input.value : "NO INPUT"
            );

            console.log(
                "3️⃣ sendMessage type:",
                typeof sendMessage
            );

            try {

                if (typeof sendMessage === "function") {

                    console.log("4️⃣ Calling sendMessage()");

                    sendMessage();

                    console.log("5️⃣ sendMessage() finished");

                } else {

                    console.error(
                        "❌ sendMessage() DOES NOT EXIST"
                    );

                }

            } catch (error) {

                console.error(
                    "❌ SEND ERROR:",
                    error
                );

                alert(
                    "SEND ERROR:\n\n" +
                    error.message
                );

            }

        });

    }

});

</script>

    
</body>
</html>
