===================================================== -->

        id="sendBtn"
        class="sendButton"
        aria-label="Send message"

<script>

(function () {

    "use strict";

    console.log(
        "🚀 Chat emergency controller loading..."
    );

    function startChat() {

        const sendBtn =
            document.getElementById("sendBtn");

        const userInput =
            document.getElementById("userInput");

        const chatBox =
            document.getElementById("chatBox");

        console.log(
            "🔎 sendBtn:",
            sendBtn
        );

        console.log(
            "🔎 userInput:",
            userInput
        );

        console.log(
            "🔎 chatBox:",
            chatBox
        );

        if (!sendBtn) {

            console.error(
                "❌ CRITICAL: sendBtn was not found."
            );

            return;

        }

        if (!userInput) {

            console.error(
                "❌ CRITICAL: userInput was not found."
            );

            return;

        }

        if (!chatBox) {

            console.error(
                "❌ CRITICAL: chatBox was not found."
            );

            return;

        }

        /*
        =================================================
        SEND BUTTON TEST / CONTROLLER
        =================================================
        */

        sendBtn.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();

                event.stopPropagation();

                console.log(
                    "🔥🔥🔥 SEND BUTTON CLICKED 🔥🔥🔥"
                );

                const message =
                    userInput.value.trim();

                /*
                -----------------------------------------
                EMPTY MESSAGE
                -----------------------------------------
                */

                if (!message) {

                    console.log(
                        "⚠️ Empty message"
                    );

                    userInput.focus();

                    return;

                }

                /*
                -----------------------------------------
                ADD USER MESSAGE
                -----------------------------------------
                */

                addLocalMessage(
                    "user",
                    message
                );

                userInput.value = "";

                userInput.style.height =
                    "auto";

                /*
                -----------------------------------------
                SHOW THINKING
                -----------------------------------------
                */

                const thinking =
                    addLocalMessage(
                        "ai",
                        "🧠 Thinking..."
                    );

                try {

                    /*
                    =====================================
                    USE SMART AI
                    =====================================
                    */

                    if (
                        typeof window.smartAIReply ===
                        "function"
                    ) {

                        console.log(
                            "🧠 Sending to smartAIReply..."
                        );

                        const response =
                            await window.smartAIReply(
                                message
                            );

                        if (thinking) {

                            thinking.remove();

                        }

                        addLocalMessage(
                            "ai",
                            response ||
                            "🤖 I don't have an answer yet."
                        );

                        return;

                    }

                    /*
                    =====================================
                    CHAT.JS FALLBACK
                    =====================================
                    */

                    if (
                        typeof window.sendMessage ===
                        "function"
                    ) {

                        console.log(
                            "💬 Using chat.js sendMessage..."
                        );

                        if (thinking) {

                            thinking.remove();

                        }

                        /*
                        Do not pass the message if
                        sendMessage() reads userInput
                        itself.
                        */

                        await window.sendMessage();

                        return;

                    }

                    /*
                    =====================================
                    NO AI ENGINE
                    =====================================
                    */

                    if (thinking) {

                        thinking.remove();

                    }

                    addLocalMessage(
                        "ai",
                        "⚠️ The AI engine is not loaded. Check the browser console for the file that failed to load."
                    );

                } catch (error) {

                    console.error(
                        "❌ SEND ERROR:",
                        error
                    );

                    if (thinking) {

                        thinking.remove();

                    }

                    addLocalMessage(
                        "ai",
                        "⚠️ Something went wrong while processing your message."
                    );

                }

            },
            false
        );

        /*
        =================================================
        ENTER KEY
        =================================================
        */

        userInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendBtn.click();

                }

            }
        );

        /*
        =================================================
        AUTO RESIZE
        =================================================
        */

        userInput.addEventListener(
            "input",
            function () {

                this.style.height =
                    "auto";

                this.style.height =
                    Math.min(
                        this.scrollHeight,
                        140
                    ) + "px";

            }
        );

        console.log(
            "✅ Emergency chat controller connected."
        );

    }

    /*
    =====================================================
    LOCAL MESSAGE RENDERER
    =====================================================
    */

    function addLocalMessage(
        sender,
        text
    ) {

        const chatBox =
            document.getElementById("chatBox");

        if (!chatBox) {

            return null;

        }

        const message =
            document.createElement("div");

        message.className =
            "message " +
            (
                sender === "user"
                    ? "user"
                    : "ai"
            );

        const messageText =
            document.createElement("div");

        messageText.className =
            "messageText";

        /*
        Escape HTML so user messages
        cannot inject HTML.
        */

        messageText.textContent =
            String(text || "");

        const messageTime =
            document.createElement("div");

        messageTime.className =
            "messageTime";

        messageTime.textContent =
            new Date().toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        message.appendChild(
            messageText
        );

        message.appendChild(
            messageTime
        );

        chatBox.appendChild(
            message
        );

        chatBox.scrollTop =
            chatBox.scrollHeight;

        return message;

    }

    /*
    =====================================================
    START AFTER DOM
    =====================================================
    */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            startChat
        );

    } else {

        startChat();

    }

})();

</script>

        );

        if (
            sendButtons.length !== 1
        ) {

            console.error(

            );

        } else {

            console.log(
                "✅ Exactly one send button found."
            );

        }

    }

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            startupCheck
        );

    } else {

        startupCheck();

    }

})();
