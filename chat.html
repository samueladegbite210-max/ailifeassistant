<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Life Assistant - Chat</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="chatHeader">

    <h1>
        🤖 AI Life Assistant
    </h1>

</header>



<!-- =====================================================
     CHAT
===================================================== -->

<main class="chatPage">

    <div
        id="chatBox"
        class="chatBox"
    >

        <div class="message ai">

            <div class="messageText">

                👋 Hello
                <span id="welcomeName">
                    Samuel
                </span>!

                <br><br>

                How can I help you today?

            </div>

            <div class="messageTime">
                Now
            </div>

        </div>

    </div>

</main>



<!-- =====================================================
     CHAT COMPOSER
===================================================== -->

<footer class="chatComposer">


    <!-- ATTACH BUTTON -->

    <button
        type="button"
        id="attachBtn"
        class="composerIcon"
        aria-label="Attach"
    >
        +
    </button>



    <!-- MESSAGE -->

    <textarea
        id="userInput"
        rows="1"
        placeholder="Ask AI Life Assistant..."
        autocomplete="off"
        spellcheck="true"
    ></textarea>



    <!-- VOICE -->

    <button
        type="button"
        id="voiceBtn"
        class="composerIcon"
        aria-label="Voice"
    >
        🎤
    </button>



    <!-- SEND -->

    <button
        type="button"
        id="sendBtn"
        class="sendButton"
        aria-label="Send message"
    >
        ➤
    </button>


</footer>



<!-- =====================================================
     ATTACHMENT MENU
===================================================== -->

<div
    id="attachmentMenu"
    class="attachmentMenu"
>

    <button
        type="button"
        id="pickImageBtn"
    >
        🖼️ Photo
    </button>


    <button
        type="button"
        id="takePhotoBtn"
    >
        📷 Camera
    </button>


    <button
        type="button"
        id="pickFileBtn"
    >
        📄 File
    </button>

</div>



<!-- =====================================================
     IMAGE PICKER
===================================================== -->

<input
    type="file"
    id="imagePicker"
    accept="image/*"
    hidden
>



<!-- =====================================================
     CAMERA
===================================================== -->

<input
    type="file"
    id="cameraPicker"
    accept="image/*"
    capture="environment"
    hidden
>



<!-- =====================================================
     FILE PICKER
===================================================== -->

<input
    type="file"
    id="filePicker"
    accept=".txt,.pdf,.doc,.docx,.csv,.json,.js,.css,.html,.md"
    hidden
>

===================================================== -->
