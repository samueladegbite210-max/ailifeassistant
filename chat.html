<!-- =====================================================
     CHAT CONTROLLER
     
     IMPORTANT:
     chat.js is intentionally NOT loaded here yet.

<script>
"use strict";

/* ==========================================
   AI LIFE ASSISTANT
   chat.js
   Version 14.0
   Stable Chat + Attachment Controller
========================================== */

console.log("💬 chat.js loading...");


/* ==========================================
   ELEMENTS
========================================== */

const chatBox =
    document.getElementById("chatBox");

const userInput =
    document.getElementById("userInput");

const sendBtn =
    document.getElementById("sendBtn");

const attachBtn =
    document.getElementById("attachBtn");

const attachmentMenu =
    document.getElementById("attachmentMenu");

const pickImageBtn =
    document.getElementById("pickImageBtn");

const takePhotoBtn =
    document.getElementById("takePhotoBtn");

const pickFileBtn =
    document.getElementById("pickFileBtn");

const imagePicker =
    document.getElementById("imagePicker");

const cameraPicker =
    document.getElementById("cameraPicker");

const filePicker =
    document.getElementById("filePicker");

const voiceBtn =
    document.getElementById("voiceBtn");

const attachmentPreview =
    document.getElementById(
        "attachmentPreview"
    );

const attachmentPreviewContent =
    document.getElementById(
        "attachmentPreviewContent"
    );

const removeAttachmentBtn =
    document.getElementById(
        "removeAttachmentBtn"
    );


/* ==========================================
   INITIAL ATTACHMENT STATE
========================================== */

window.aiAttachment =
    window.aiAttachment || null;

window.uploadedFiles =
    window.uploadedFiles || [];


/* ==========================================
   SCROLL CHAT TO BOTTOM
========================================== */

function scrollChatToBottom() {

    if (!chatBox) {
        return;
    }

    chatBox.scrollTop =
        chatBox.scrollHeight;

}


/* ==========================================
   ADD TEXT MESSAGE
========================================== */

function addLocalMessage(
    sender,
    text
) {

    if (!chatBox) {

        console.error(
            "❌ chatBox not found"
        );

        return null;

    }


    const message =
        document.createElement("div");


    message.className =
        sender === "user"
            ? "message user"
            : "message ai";


    const messageText =
        document.createElement("div");


    messageText.className =
        "messageText";


    messageText.textContent =
        String(text || "");


    const messageTime =
        document.createElement("div");


    messageTime.className =
        "messageTime";


    messageTime.textContent =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    message.appendChild(
        messageText
    );


    message.appendChild(
        messageTime
    );


    chatBox.appendChild(
        message
    );


    scrollChatToBottom();


    return message;

}


/* ==========================================
   ADD ATTACHMENT MESSAGE

   IMPORTANT:
   This function displays an attachment
   inside the chat exactly ONCE.
========================================== */

function addAttachmentMessage(
    sender,
    file,
    type
) {

    if (
        !chatBox ||
        !file
    ) {

        return null;

    }


    const message =
        document.createElement("div");


    message.className =
        sender === "user"
            ? "message user"
            : "message ai";


    const messageText =
        document.createElement("div");


    messageText.className =
        "messageText";


    /* ======================================
       IMAGE
    ====================================== */

    if (type === "image") {

        const image =
            document.createElement("img");


        image.className =
            "chatAttachmentImage";


        const imageURL =
            URL.createObjectURL(file);


        image.src =
            imageURL;


        image.alt =
            file.name ||
            "Uploaded image";


        image.onload =
            function () {

                scrollChatToBottom();

            };


        messageText.appendChild(
            image
        );


        const fileName =
            document.createElement("div");


        fileName.className =
            "chatAttachmentName";


        fileName.textContent =
            "🖼️ " + file.name;


        messageText.appendChild(
            fileName
        );

    }


    /* ======================================
       FILE
    ====================================== */

    else {

        const fileBox =
            document.createElement("div");


        fileBox.className =
            "chatFileAttachment";


        const icon =
            document.createElement("div");


        icon.className =
            "chatFileIcon";


        icon.textContent =
            "📄";


        const fileInfo =
            document.createElement("div");


        fileInfo.className =
            "chatFileInfo";


        const fileName =
            document.createElement("div");


        fileName.className =
            "chatAttachmentName";


        fileName.textContent =
            file.name ||
            "Unknown file";


        const fileType =
            document.createElement("div");


        fileType.className =
            "chatAttachmentType";


        fileType.textContent =
            file.type ||
            "Unknown file type";


        fileInfo.appendChild(
            fileName
        );


        fileInfo.appendChild(
            fileType
        );


        fileBox.appendChild(
            icon
        );


        fileBox.appendChild(
            fileInfo
        );


        messageText.appendChild(
            fileBox
        );

    }


    /* ======================================
       TIME
    ====================================== */

    const messageTime =
        document.createElement("div");


    messageTime.className =
        "messageTime";


    messageTime.textContent =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    message.appendChild(
        messageText
    );


    message.appendChild(
        messageTime
    );


    chatBox.appendChild(
        message
    );


    scrollChatToBottom();


    return message;

}


/* ==========================================
   SHOW ATTACHMENT PREVIEW
========================================== */

function showAttachmentPreview(
    file,
    type
) {

    if (
        !attachmentPreview ||
        !attachmentPreviewContent ||
        !file
    ) {

        return;

    }


    attachmentPreviewContent.innerHTML =
        "";


    /* ======================================
       IMAGE PREVIEW
    ====================================== */

    if (type === "image") {

        const image =
            document.createElement("img");


        image.className =
            "attachmentPreviewImage";


        image.src =
            URL.createObjectURL(file);


        image.alt =
            file.name;


        attachmentPreviewContent.appendChild(
            image
        );

    }


    /* ======================================
       TEXT AREA
    ====================================== */

    const textBox =
        document.createElement("div");


    textBox.className =
        "attachmentPreviewText";


    const name =
        document.createElement("div");


    name.className =
        "attachmentPreviewName";


    name.textContent =
        type === "image"
            ? "🖼️ " + file.name
            : "📄 " + file.name;


    const fileType =
        document.createElement("div");


    fileType.className =
        "attachmentPreviewType";


    fileType.textContent =
        file.type ||
        "Unknown file";


    textBox.appendChild(
        name
    );


    textBox.appendChild(
        fileType
    );


    attachmentPreviewContent.appendChild(
        textBox
    );


    attachmentPreview.classList.add(
        "show"
    );

}


/* ==========================================
   REMOVE CURRENT ATTACHMENT
========================================== */

function removeCurrentAttachment() {

    window.aiAttachment =
        null;


    if (attachmentPreview) {

        attachmentPreview.classList.remove(
            "show"
        );

    }


    if (attachmentPreviewContent) {

        attachmentPreviewContent.innerHTML =
            "";

    }


    if (imagePicker) {

        imagePicker.value =
            "";

    }


    if (cameraPicker) {

        cameraPicker.value =
            "";

    }


    if (filePicker) {

        filePicker.value =
            "";

    }


    console.log(
        "🗑️ Attachment removed"
    );

}


/* ==========================================
   REMOVE ATTACHMENT BUTTON
========================================== */

if (removeAttachmentBtn) {

    removeAttachmentBtn.addEventListener(
        "click",
        function () {

            removeCurrentAttachment();

        }
    );

}


/* ==========================================
   ATTACHMENT MENU
========================================== */

function closeAttachmentMenu() {

    if (!attachmentMenu) {
        return;
    }


    attachmentMenu.classList.remove(
        "show"
    );


    attachmentMenu.style.display =
        "none";

}


function openAttachmentMenu() {

    if (!attachmentMenu) {
        return;
    }


    attachmentMenu.classList.add(
        "show"
    );


    attachmentMenu.style.display =
        "block";

}


/* ==========================================
   ATTACH BUTTON
========================================== */

if (attachBtn) {

    attachBtn.addEventListener(
        "click",
        function (event) {

            event.preventDefault();

            event.stopPropagation();


            if (!attachmentMenu) {
                return;
            }


            const isOpen =
                attachmentMenu.classList.contains(
                    "show"
                );


            if (isOpen) {

                closeAttachmentMenu();

            } else {

                openAttachmentMenu();

            }

        }
    );

}


/* ==========================================
   IMAGE PICKER BUTTON
========================================== */

if (pickImageBtn) {

    pickImageBtn.addEventListener(
        "click",
        function (event) {

            event.preventDefault();

            event.stopPropagation();


            closeAttachmentMenu();


            if (!imagePicker) {
                return;
            }


            imagePicker.value =
                "";


            imagePicker.click();

        }
    );

}


/* ==========================================
   CAMERA BUTTON
========================================== */

if (takePhotoBtn) {

    takePhotoBtn.addEventListener(
        "click",
        function (event) {

            event.preventDefault();

            event.stopPropagation();


            closeAttachmentMenu();


            if (!cameraPicker) {
                return;
            }


            cameraPicker.value =
                "";


            cameraPicker.click();

        }
    );

}


/* ==========================================
   FILE PICKER BUTTON
========================================== */

if (pickFileBtn) {

    pickFileBtn.addEventListener(
        "click",
        function (event) {

            event.preventDefault();

            event.stopPropagation();


            closeAttachmentMenu();


            if (!filePicker) {
                return;
            }


            filePicker.value =
                "";


            filePicker.click();

        }
    );

}


/* ==========================================
   SAVE IMAGE ATTACHMENT

   IMPORTANT:
   The image is added to the chat only ONCE.
========================================== */

function saveImageAttachment(file) {

    if (!file) {
        return;
    }


    console.log(
        "🖼️ Image selected:",
        file.name
    );


    /* ======================================
       SAVE CURRENT ATTACHMENT
    ====================================== */

    window.aiAttachment = {

        type: "image",

        name: file.name,

        mimeType: file.type,

        size: file.size,

        file: file,

        data: file

    };


    /* ======================================
       ADD TO UPLOAD HISTORY
    ====================================== */

    window.uploadedFiles.push({

        name: file.name,

        type:
            file.type ||
            "image",

        size:
            file.size,

        uploadedAt:
            new Date().toISOString()

    });


    /* ======================================
       SHOW PREVIEW ONCE
    ====================================== */

    showAttachmentPreview(
        file,
        "image"
    );


    /* ======================================
       SHOW CHAT IMAGE ONCE

       DO NOT CALL THIS FUNCTION AGAIN.
    ====================================== */

    const attachmentMessage =
        addAttachmentMessage(
            "user",
            file,
            "image"
        );


    console.log(
        "🖼️ Image added to chat:",
        attachmentMessage
    );

}


/* ==========================================
   SAVE FILE ATTACHMENT
========================================== */

function saveFileAttachment(file) {

    if (!file) {
        return;
    }


    console.log(
        "📄 File selected:",
        file.name
    );


    window.aiAttachment = {

        type: "file",

        name: file.name,

        mimeType: file.type,

        size: file.size,

        file: file

    };


    window.uploadedFiles.push({

        name: file.name,

        type:
            file.type ||
            "application/octet-stream",

        size:
            file.size,

        uploadedAt:
            new Date().toISOString()

    );


    /* ======================================
       SHOW PREVIEW ONCE
    ====================================== */

    showAttachmentPreview(
        file,
        "file"
    );


    /* ======================================
       SHOW FILE ONCE
    ====================================== */

    const attachmentMessage =
        addAttachmentMessage(
            "user",
            file,
            "file"
        );


    console.log(
        "📄 File added to chat:",
        attachmentMessage
    );

}


/* ==========================================
   IMAGE PICKER CHANGE
========================================== */

if (imagePicker) {

    imagePicker.addEventListener(
        "change",
        function () {

            const file =
                this.files &&
                this.files[0];


            if (!file) {
                return;
            }


            saveImageAttachment(
                file
            );

        }
    );

}


/* ==========================================
   CAMERA PICKER CHANGE
========================================== */

if (cameraPicker) {

    cameraPicker.addEventListener(
        "change",
        function () {

            const file =
                this.files &&
                this.files[0];


            if (!file) {
                return;
            }


            saveImageAttachment(
                file
            );

        }
    );

}


/* ==========================================
   FILE PICKER CHANGE
========================================== */

if (filePicker) {

    filePicker.addEventListener(
        "change",
        function () {

            const file =
                this.files &&
                this.files[0];


            if (!file) {
                return;
            }


            saveFileAttachment(
                file
            );

        }
    );

}


/* ==========================================
   SEND MESSAGE
========================================== */

async function sendMessage() {

    console.log(
        "📤 Sending message..."
    );


    if (!userInput) {

        console.error(
            "❌ userInput not found"
        );

        return;

    }


    let message =
        userInput.value.trim();


    const attachment =
        window.aiAttachment;


    /* ======================================
       AUTO COMMAND FOR ATTACHMENTS

       If the user only uploads an image
       and presses send, ask the AI to
       describe the image.

       If the user uploads a file and
       presses send, summarize the file.
    ====================================== */

    if (
        !message &&
        attachment
    ) {

        if (
            attachment.type ===
            "image"
        ) {

            message =
                "describe the image";

        }

        else if (
            attachment.type ===
            "file"
        ) {

            message =
                "summarize the file";

        }

    }


    /* ======================================
       NOTHING TO SEND
    ====================================== */

    if (!message) {

        console.log(
            "⚠️ Nothing to send"
        );


        userInput.focus();

        return;

    }


    /* ======================================
       SHOW USER MESSAGE
    ====================================== */

    addLocalMessage(
        "user",
        message
    );


    /* ======================================
       CLEAR INPUT
    ====================================== */

    userInput.value =
        "";


    userInput.style.height =
        "auto";


    /* ======================================
       SHOW THINKING
    ====================================== */

    const thinking =
        addLocalMessage(
            "ai",
            "🧠 Thinking..."
        );


    try {

        /* ==================================
           CHECK SMART AI
        ================================== */

        if (
            typeof window.smartAIReply !==
            "function"
        ) {

            console.error(
                "❌ smartAIReply is not available"
            );


            if (thinking) {

                thinking.remove();

            }


            addLocalMessage(
                "ai",
                "⚠️ smartAI.js is not loaded."
            );


            return;

        }


        console.log(
            "🧠 Sending message to Smart AI:",
            message
        );


        /* ==================================
           GET AI RESPONSE
        ================================== */

        const response =
            await window.smartAIReply(
                message
            );


        /* ==================================
           REMOVE THINKING
        ================================== */

        if (thinking) {

            thinking.remove();

        }


        /* ==================================
           SHOW AI RESPONSE
        ================================== */

        addLocalMessage(
            "ai",

            response ||
            "🤖 I don't have an answer yet."
        );


        /* ==================================
           REMOVE ATTACHMENT

           We remove it only after the AI
           finishes processing it.
        ================================== */

        if (attachment) {

            removeCurrentAttachment();

        }

    }


    catch (error) {

        console.error(
            "❌ SEND ERROR:",
            error
        );


        if (thinking) {

            thinking.remove();

        }


        addLocalMessage(
            "ai",
            "⚠️ Something went wrong while processing your message."
        );

    }

}


/* ==========================================
   GLOBAL SEND ACCESS
========================================== */

window.sendMessage =
    sendMessage;


/* ==========================================
   SEND BUTTON
========================================== */

if (sendBtn) {

    sendBtn.addEventListener(
        "click",
        function (event) {

            event.preventDefault();

            event.stopPropagation();


            sendMessage();

        }
    );


    console.log(
        "✅ Send button connected"
    );

}

else {

    console.error(
        "❌ sendBtn not found"
    );

}


/* ==========================================
   ENTER KEY
========================================== */

if (userInput) {

    userInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();


                sendMessage();

            }

        }
    );

}


/* ==========================================
   AUTO RESIZE TEXTAREA
========================================== */

if (userInput) {

    userInput.addEventListener(
        "input",
        function () {

            this.style.height =
                "auto";


            this.style.height =
                Math.min(
                    this.scrollHeight,
                    140
                ) + "px";

        }
    );

}


/* ==========================================
   CLOSE MENU WHEN CLICKING OUTSIDE
========================================== */

document.addEventListener(
    "click",
    function (event) {

        if (
            attachmentMenu &&
            attachBtn &&
            !attachmentMenu.contains(
                event.target
            ) &&
            !attachBtn.contains(
                event.target
            )
        ) {

            closeAttachmentMenu();

        }

    }
);


/* ==========================================
   WELCOME NAME
========================================== */

const savedName =
    localStorage.getItem(
        "profileName"
    );


const welcomeName =
    document.getElementById(
        "welcomeName"
    );


if (
    welcomeName &&
    savedName
) {

    welcomeName.textContent =
        savedName;

}


/* ==========================================
   VOICE BUTTON PLACEHOLDER
========================================== */

if (voiceBtn) {

    voiceBtn.addEventListener(
        "click",
        function () {

            console.log(
                "🎤 Voice button pressed"
