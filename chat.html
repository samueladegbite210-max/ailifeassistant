<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Life Assistant - Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ==========================================
     HEADER
========================================== -->

<header class="chatHeader">
    <h1>🤖 AI Life Assistant</h1>
</header>


<!-- ==========================================
     CHAT AREA
========================================== -->

<main class="chatPage">

    <div id="chatBox" class="chatBox">

        <div class="message ai">

            <div class="messageText">

                👋 Hello
                <span id="welcomeName">Samuel</span>!

                <br><br>

                How can I help you today?

            </div>

            <div class="messageTime">
                Now
            </div>

        </div>

    </div>

</main>


<!-- ==========================================
     CHAT COMPOSER
========================================== -->

<footer class="chatComposer">

    <button
        type="button"
        id="attachBtn"
        class="composerIcon"
        aria-label="Attach"
    >
        +
    </button>


    <textarea
        id="userInput"
        rows="1"
        placeholder="Ask AI Life Assistant..."
        autocomplete="off"
    ></textarea>


    <button
        type="button"
        id="voiceBtn"
        class="composerIcon"
        aria-label="Voice"
    >
        🎤
    </button>


    <button
        type="button"
        id="sendBtn"
        class="sendButton"
        aria-label="Send"
    >
        ➤
    </button>

</footer>


<!-- ==========================================
     ATTACHMENT MENU
========================================== -->

<div
    id="attachmentMenu"
    class="attachmentMenu"
>

    <button
        type="button"
        id="pickImageBtn"
    >
        🖼️ Photo
    </button>


    <button
        type="button"
        id="takePhotoBtn"
    >
        📷 Camera
    </button>


    <button
        type="button"
        id="pickFileBtn"
    >
        📄 File
    </button>

</div>


<!-- ==========================================
     HIDDEN FILE INPUTS
========================================== -->

<input
    type="file"
    id="imagePicker"
    accept="image/*"
    hidden
>

<input
    type="file"
    id="cameraPicker"
    accept="image/*"
    capture="environment"
    hidden
>

<input
    type="file"
    id="filePicker"
    accept=".txt,.pdf,.doc,.docx,.csv,.json,.js,.css,.html,.md"
    hidden
>


<!-- ==========================================
     BOTTOM NAVIGATION
========================================== -->

<nav class="navbar">

    <a href="dashboard.html">
        🏠
        <br>
        Home
    </a>


    <a
        href="chat.html"
        class="active"
    >
        🤖
        <br>
        AI
    </a>


    <a href="notes.html">
        📝
        <br>
        Notes
    </a>


    <a href="calendar.html">
        📅
        <br>
        Calendar
    </a>


    <a href="profile.html">
        👤
        <br>
        Profile
    </a>

</nav>


<!-- ==========================================
     CORE AI FILES
     
     IMPORTANT:
     Load helper/module files FIRST.
     Load smartAI AFTER them.
     Load chat.js LAST.
========================================== -->

<script src="js/helpers.js?v=10"></script>

<script src="js/conversation.js?v=10"></script>

<script src="js/knowledge.js?v=10"></script>

<script src="js/memory.js?v=10"></script>

========================================== -->

<script src="js/learnUser.js?v=10"></script>

<script src="js/searchOnline.js?v=10"></script>

<!-- ==========================================
     EXTERNAL DOCUMENT LIBRARIES
========================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"
></script>

<script
    src="https://unpkg.com/mammoth/mammoth.browser.min.js"
></script>


<!-- ==========================================

========================================== -->

<script src="js/attachmentAI.js?v=10"></script>

     STARTUP TEST
========================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    console.log("=================================");
    console.log("🚀 AI LIFE ASSISTANT STARTUP");
    console.log("=================================");

    const sendButton =
        document.getElementById("sendBtn");

    const input =
        document.getElementById("userInput");

    const chat =
        document.getElementById("chatBox");


    console.log(
        "chatBox:",
        chat
    );

    console.log(
        "userInput:",
        input
    );

    console.log(
        "sendBtn:",
        sendButton
    );

    console.log(
        "sendMessage:",
        typeof window.sendMessage
    );

    console.log(
        "aiReply:",
        typeof window.aiReply
    );

    console.log(
        "smartAIReply:",
        typeof window.smartAIReply
    );

    console.log(
        "conversationReply:",
        typeof window.conversationReply
    );

    console.log(
        "memoryReply:",
        typeof window.memoryReply
    );

    console.log(
        "brain:",
        typeof window.aiBrainReply
    );

    console.log("=================================");


    // Welcome name

    const profileName =
        localStorage.getItem("profileName");

    const welcomeName =
        document.getElementById("welcomeName");


    if (
        welcomeName &&
        profileName
    ) {

        welcomeName.textContent =
            profileName;

    }


});

</script>

</body>

</html>
