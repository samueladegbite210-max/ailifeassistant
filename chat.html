/* =====================================================
   SHOW ATTACHMENT PREVIEW
===================================================== */

function showAttachmentPreview(
    file,
    type
) {

    if (
        !attachmentPreview ||
        !attachmentPreviewContent ||
        !file
    ) {

        return;

    }


    attachmentPreviewContent.innerHTML =
        "";


    /*
    IMAGE PREVIEW
    */

    if (type === "image") {

        const image =
            document.createElement("img");

        image.src =
            URL.createObjectURL(file);

        image.alt =
            file.name;

        attachmentPreviewContent.appendChild(
            image
        );

    }


    /*
    FILE INFORMATION
    */

    const textBox =
        document.createElement("div");

    textBox.className =
        "attachmentPreviewText";


    const name =
        document.createElement("div");

    name.className =
        "attachmentPreviewName";

    name.textContent =
        type === "image"
            ? "🖼️ " + file.name
            : "📄 " + file.name;


    const fileType =
        document.createElement("div");

    fileType.className =
        "attachmentPreviewType";

    fileType.textContent =
        file.type ||
        "Unknown file";


    textBox.appendChild(name);

    textBox.appendChild(fileType);

    attachmentPreviewContent.appendChild(
        textBox
    );


    attachmentPreview.classList.add(
        "show"
    );

}

===================================================== */

    }

    if (cameraPicker) {

        cameraPicker.value = "";

    if (filePicker) {

        filePicker.value = "";

    console.log(
        "🗑️ Attachment removed"
    );

}

    removeAttachmentBtn.addEventListener(
        "click",
        function () {

            removeCurrentAttachment();

        }
    );

}


/* =====================================================
   FORMAT AI RESPONSE
===================================================== */

function formatAIResponse(text) {

    if (!text) {

        return document.createDocumentFragment();

    }


    const fragment =
        document.createDocumentFragment();


    const lines =
        String(text)
        .replace(/\r/g, "")
        .split("\n");


    let currentList =
        null;


    function closeList() {

        if (currentList) {

            fragment.appendChild(
                currentList
            );

            currentList =
                null;

        }

    }


    lines.forEach(
        function (line) {

            const trimmed =
                line.trim();


            /*
            EMPTY LINE
            */

            if (!trimmed) {

                closeList();

                return;

            }


            /*
            HEADINGS
            */

            if (
                /^#{1,6}\s+/.test(
                    trimmed
                )
            ) {

                closeList();


                const heading =
                    document.createElement(
                        "div"
                    );


                heading.className =
                    "aiHeading";


                heading.textContent =
                    trimmed.replace(
                        /^#{1,6}\s+/,
                        ""
                    );


                fragment.appendChild(
                    heading
                );

                return;

            }


            /*
            BULLET LIST
            */

            if (
                /^[-*•]\s+/.test(
                    trimmed
                )
            ) {

                if (
                    !currentList ||
                    currentList.tagName !== "UL"
                ) {

                    closeList();

                    currentList =
                        document.createElement(
                            "ul"
                        );

                    currentList.className =
                        "aiList";

                }


                const item =
                    document.createElement(
                        "li"
                    );


                item.textContent =
                    trimmed.replace(
                        /^[-*•]\s+/,
                        ""
                    );


                currentList.appendChild(
                    item
                );

                return;

            }


            /*
            NUMBERED LIST
            */

            if (
                /^\d+\.\s+/.test(
                    trimmed
                )
            ) {

                if (
                    !currentList ||
                    currentList.tagName !== "OL"
                ) {

                    closeList();

                    currentList =
                        document.createElement(
                            "ol"
                        );

                    currentList.className =
                        "aiList";

                }


                const item =
                    document.createElement(
                        "li"
                    );


                item.textContent =
                    trimmed.replace(
                        /^\d+\.\s+/,
                        ""
                    );


                currentList.appendChild(
                    item
                );

                return;

            }


            /*
            NORMAL PARAGRAPH
            */

            closeList();


            const paragraph =
                document.createElement(
                    "div"
                );


            paragraph.className =
                "aiParagraph";


            paragraph.textContent =
                trimmed
                .replace(
                    /\*\*(.*?)\*\*/g,
                    "$1"
                )
                .replace(
                    /\*(.*?)\*/g,
                    "$1"
                );


            fragment.appendChild(
                paragraph
            );

        }
    );


    closeList();


    return fragment;

}


/* =====================================================
   ADD TEXT MESSAGE
===================================================== */

function addLocalMessage(
    sender,
    text
) {

    if (!chatBox) {

        console.error(
            "❌ chatBox not found"
        );

        return null;

    }


    const message =
        document.createElement("div");


    message.className =
        "message " +
        (
            sender === "user"
                ? "user"
                : "ai"
        );


    const messageText =
        document.createElement("div");

    messageText.className =
        "messageText";


    /*
    AI MESSAGE
    */

    if (sender === "ai") {

        messageText.appendChild(
            formatAIResponse(text)
        );

    }


    /*
    USER MESSAGE
    */

    else {

        messageText.textContent =
            String(text || "");

    }


    /*
    MESSAGE TIME
    */

    const messageTime =
        document.createElement("div");

    messageTime.className =
        "messageTime";

    messageTime.textContent =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    message.appendChild(
        messageText
    );

    message.appendChild(
        messageTime
    );

    chatBox.appendChild(
        message
    );

    chatBox.scrollTop =
        chatBox.scrollHeight;


    return message;

}


window.addLocalMessage =
    addLocalMessage;


/* =====================================================
   ADD ATTACHMENT MESSAGE
===================================================== */

function addAttachmentMessage(

    file,
    type
) {

        !chatBox ||
        !file
    ) {

        return null;

    }


    const message =
        document.createElement("div");


    message.className =

                ? "user"

        );


    const messageText =
        document.createElement("div");

    messageText.className =
        "messageText";


    /*
    IMAGE
    */

    if (type === "image") {

        const image =
            document.createElement("img");

        image.className =
            "chatAttachmentImage";

        image.src =
            URL.createObjectURL(file);

        image.alt =
            file.name;


        image.onload =
            function () {

                chatBox.scrollTop =
                    chatBox.scrollHeight;

            };


        messageText.appendChild(
            image
        );


        const fileName =
            document.createElement("div");

        fileName.className =
            "chatAttachmentName";

        fileName.textContent =
            "🖼️ " + file.name;


        messageText.appendChild(
            fileName
        );

    }


    /*
    FILE
    */

    else {

        const fileBox =
            document.createElement("div");

        fileBox.className =
            "chatFileAttachment";


        const icon =
            document.createElement("div");

        icon.className =
            "chatFileIcon";

        icon.textContent =
            "📄";


        const fileInfo =
            document.createElement("div");

        fileInfo.className =
            "chatFileInfo";


        const fileName =
            document.createElement("div");

        fileName.className =
            "chatAttachmentName";

        fileName.textContent =
            file.name;


        const fileType =
            document.createElement("div");

        fileType.className =
            "chatAttachmentType";

        fileType.textContent =
            file.type ||
            "File";


        fileInfo.appendChild(
            fileName
        );

        fileInfo.appendChild(
            fileType
        );

        fileBox.appendChild(
            icon
        );

        fileBox.appendChild(
            fileInfo
        );

        messageText.appendChild(
            fileBox
        );

    }


    const messageTime =
        document.createElement("div");

    messageTime.className =
        "messageTime";

    messageTime.textContent =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    message.appendChild(
        messageText
    );

    message.appendChild(
        messageTime
    );

    chatBox.appendChild(
        message
    );

    chatBox.scrollTop =
        chatBox.scrollHeight;


    return message;

}


window.addAttachmentMessage =
    addAttachmentMessage;


/* =====================================================
   AUTOMATIC ATTACHMENT ANALYSIS
===================================================== */

async function autoAnalyzeAttachment(
    attachment
) {

    if (!attachment) {

        return;

    }


    if (attachmentProcessing) {

        console.warn(
            "⚠️ Attachment already being processed"
        );

        return;

    }


    attachmentProcessing =
        true;


    try {

        console.log(
            "🤖 Starting automatic attachment analysis..."
        );


        /*
        VERIFY AI ENGINE
        */

        if (
            typeof window.smartAIReply !==
            "function"
        ) {

            throw new Error(
                "smartAIReply is not available"
            );

        }


        /*
        DETERMINE REQUEST
        */

        let automaticPrompt;


        if (
            attachment.type === "image"
        ) {

            automaticPrompt =
                "Describe and analyze this image. Explain clearly what you can see.";

        }

        else {

            automaticPrompt =
                "Read and summarize this file. Explain the most important information clearly.";

        }


        /*
        SHOW ANALYZING MESSAGE
        */

        const thinking =
            addLocalMessage(
                "ai",
                attachment.type === "image"
                    ? "👀 Analyzing your image..."
                    : "📄 Reading your file..."
            );


        /*
        SEND TO AI
        */

        const response =
            await window.smartAIReply(
                automaticPrompt
            );


        /*
        REMOVE THINKING MESSAGE
        */

        if (thinking) {

            thinking.remove();

        }


        /*
        SHOW AI RESPONSE
        */

        addLocalMessage(
            "ai",
            response ||
            (
                attachment.type === "image"
                    ? "⚠️ I couldn't analyze this image."
                    : "⚠️ I couldn't read this file."
            )
        );


        console.log(
            "✅ Automatic attachment analysis complete"
        );

    }

    catch (error) {

        console.error(
            "❌ Automatic attachment analysis error:",
            error
        );


        addLocalMessage(
            "ai",
            attachment.type === "image"
                ? "⚠️ I received your image, but I couldn't analyze it automatically."
                : "⚠️ I received your file, but I couldn't read it automatically."
        );

    }

    finally {

        attachmentProcessing =
            false;

    }

}


window.autoAnalyzeAttachment =
    autoAnalyzeAttachment;

/* =====================================================
   SAVE IMAGE ATTACHMENT
===================================================== */

async function saveImageAttachment(
    file
) {

    if (!file) {

        return;

    }


    console.log(
        "🖼️ Image selected:",
        file.name
    );


    window.aiAttachment = {

        type: "image",

        name: file.name,

        mimeType: file.type,

        size: file.size,

        file: file,

        data: file

    };


    window.uploadedFiles.push({

        name: file.name,

        type:
            file.type || "image",

        size: file.size,

        uploadedAt:
            new Date().toISOString()

    });


    /*
    SHOW PREVIEW
    */

    showAttachmentPreview(
        file,
        "image"
    );


    /*
    SHOW IMAGE IN CHAT
    */

    addAttachmentMessage(
        "user",
        file,
        "image"
    );


    /*
    AUTOMATIC AI ANALYSIS
    */

    await autoAnalyzeAttachment(
        window.aiAttachment
    );

}


/* =====================================================
   SAVE FILE ATTACHMENT
===================================================== */

async function saveFileAttachment(
    file
) {

    if (!file) {

        return;

    }


    console.log(
        "📄 File selected:",
        file.name
    );


    window.aiAttachment = {

        type: "file",

        name: file.name,

        mimeType: file.type,

        size: file.size,

        file: file

    };


    window.uploadedFiles.push({

        name: file.name,

        type:
            file.type ||
            "application/octet-stream",

        size: file.size,

        uploadedAt:
            new Date().toISOString()

    );


    showAttachmentPreview(
        file,
        "file"
    );


    addAttachmentMessage(
        "user",
        file,
        "file"
    );


    /*
    AUTOMATIC FILE ANALYSIS
    */

    await autoAnalyzeAttachment(
        window.aiAttachment
    );

}

        "🔥 SEND BUTTON PRESSED"
    );


    if (!userInput) {

        console.error(
            "❌ userInput not found"
        );

        return;

    }


    const message =
        userInput.value.trim();


    /*
    EMPTY MESSAGE
    */

    if (!message) {

        userInput.focus();

        return;

    }


    /*
    SHOW USER MESSAGE
    */

    addLocalMessage(
        "user",
        message
    );


    userInput.value =
        "";

    userInput.style.height =
        "auto";


    /*
    SHOW THINKING
    */

    const thinking =
        addLocalMessage(
            "ai",
            "🧠 Thinking..."
        );


    try {

        if (
            typeof window.smartAIReply !==
            "function"
        ) {

            throw new Error(
                "smartAIReply is not available"
            );

        }


        console.log(
            "🧠 Sending to smartAI..."
        );


        const response =
            await window.smartAIReply(
                message
            );


        if (thinking) {

            thinking.remove();

        }


        addLocalMessage(
            "ai",
            response ||
            "🤖 I don't have an answer yet."
        );


        /*
        IMPORTANT:

        DO NOT REMOVE ATTACHMENT HERE.

        This allows follow-up questions
        about the same image or file.
        */

    }

    catch (error) {

        console.error(
            "❌ SEND ERROR:",
            error
        );


        if (thinking) {

            thinking.remove();

        }


        addLocalMessage(
            "ai",
            "⚠️ Something went wrong while processing your message."
        );

    }

}


window.sendMessage =
    sendMessage;


/* =====================================================
   SEND BUTTON
===================================================== */

if (sendBtn) {

    sendBtn.addEventListener(
        "click",
        function (event) {

            event.preventDefault();

            event.stopPropagation();

            sendMessage();

        }
    );


    console.log(
        "✅ Send button connected"
    );

}

else {

    console.error(
        "❌ sendBtn NOT FOUND"
    );

}


/* =====================================================
   ENTER KEY
===================================================== */

if (userInput) {

    userInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );

}


/* =====================================================
   AUTO RESIZE
===================================================== */

if (userInput) {

    userInput.addEventListener(
        "input",
        function () {

            this.style.height =
                "auto";


            this.style.height =
                Math.min(
                    this.scrollHeight,
                    140
                ) + "px";

        }
    );

}


/* =====================================================
   CLOSE MENU OUTSIDE
===================================================== */

document.addEventListener(
    "click",
    function (event) {

        if (
            attachmentMenu &&
            attachBtn &&
            !attachmentMenu.contains(
                event.target
            ) &&
            !attachBtn.contains(
                event.target
            )
        ) {

            closeAttachmentMenu();

        }

    }
);


/* =====================================================
   WELCOME NAME
===================================================== */

const savedName =
    localStorage.getItem(
        "profileName"
    );


const welcomeName =
    document.getElementById(
        "welcomeName"
    );


if (
    welcomeName &&
    savedName
) {

    welcomeName.textContent =
        savedName;

}


/* =====================================================
   GLOBAL ACCESS
===================================================== */

window.formatAIResponse =
    formatAIResponse;

window.showAttachmentPreview =
    showAttachmentPreview;

window.removeCurrentAttachment =
    removeCurrentAttachment;


/* =====================================================
   FINAL STARTUP CHECK
===================================================== */

console.log(
    "========================================"
);

console.log(
    "🚀 AI LIFE ASSISTANT READY"
);

console.log(
    "smartAIReply:",
    typeof window.smartAIReply
);

console.log(
    "readImageText:",
    typeof window.readImageText
);

console.log(
    "analyzeImage:",
    typeof window.analyzeImage
);

console.log(
    "analyzeFile:",
    typeof window.analyzeFile
);

console.log(
    "Send:",
    !!sendBtn
);

console.log(
    "Attach:",
    !!attachBtn
);

console.log(
    "Image picker:",
    !!imagePicker
);

console.log(
    "Camera picker:",
    !!cameraPicker
);

console.log(
    "File picker:",
    !!filePicker
);

console.log(
    "========================================"
);


</script>
