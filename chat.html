/* =====================================================

function showAttachmentPreview(
    file,
    type
) {

    if (
        !attachmentPreview ||
        !attachmentPreviewContent ||
        !file
    ) {
        return;
    }


    attachmentPreviewContent.innerHTML =
        "";


    /*
    IMAGE PREVIEW
    */

    if (type === "image") {

        const image =
            document.createElement("img");

        image.src =
            URL.createObjectURL(file);

        image.alt =
            file.name;

        attachmentPreviewContent.appendChild(
            image
        );

    }


    /*
    FILE TEXT
    */

    const textBox =
        document.createElement("div");

    textBox.className =
        "attachmentPreviewText";


    const name =
        document.createElement("div");

    name.className =
        "attachmentPreviewName";

    name.textContent =
        type === "image"
            ? "🖼️ " + file.name
            : "📄 " + file.name;


    const fileType =
        document.createElement("div");

    fileType.className =
        "attachmentPreviewType";

    fileType.textContent =
        file.type ||
        "Unknown file";


    textBox.appendChild(name);

    textBox.appendChild(fileType);

    attachmentPreviewContent.appendChild(
        textBox
    );


    attachmentPreview.classList.add(
        "show"
    );

}

/* =====================================================
   SIMPLE MARKDOWN FORMATTER
===================================================== */

function formatAIMessage(text) {

    let html =
        String(text || "");


    /*
    ESCAPE HTML FIRST
    FOR SAFETY
    */

    html =
        html
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");


    /*
    MARKDOWN TABLES

    Convert tables into simple readable blocks
    instead of allowing broken table syntax.
    */

    html =
        html.replace(
            /^\|(.+)\|\s*\n\|[-:\s|]+\|\s*\n((?:\|.+\|\s*\n?)*)/gm,
            function (
                match,
                header,
                rows
            ) {

                const headers =
                    header
                    .split("|")
                    .map(
                        item =>
                            item.trim()
                    )
                    .filter(Boolean);


                let output =
                    '<div class="markdownTable">';


                output +=
                    '<div class="markdownTableHeader">' +
                    headers.join(" • ") +
                    '</div>';


                const rowList =
                    rows
                    .trim()
                    .split("\n");


                rowList.forEach(
                    function (row) {

                        const cells =
                            row
                            .split("|")
                            .map(
                                item =>
                                    item.trim()
                            )
                            .filter(Boolean);


                        if (
                            cells.length
                        ) {

                            output +=
                                '<div class="markdownTableRow">' +
                                cells.join(" — ") +
                                '</div>';

                        }

                    }
                );


                output +=
                    '</div>';


                return output;

            }
        );


    /*
    HEADINGS
    */

    html =
        html.replace(
            /^### (.+)$/gm,
            "<h3>$1</h3>"
        );

    html =
        html.replace(
            /^## (.+)$/gm,
            "<h2>$1</h2>"
        );

    html =
        html.replace(
            /^# (.+)$/gm,
            "<h1>$1</h1>"
        );


    /*
    BOLD
    */

    html =
        html.replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
        );


    /*
    ITALIC
    */

    html =
        html.replace(
            /\*(.+?)\*/g,
            "<em>$1</em>"
        );


    /*
    BULLET POINTS
    */

    html =
        html.replace(
            /^[-*] (.+)$/gm,
            "<li>$1</li>"
        );


    /*
    NUMBERED LISTS
    */

    html =
        html.replace(
            /^\d+\. (.+)$/gm,
            "<li>$1</li>"
        );


    /*
    GROUP LIST ITEMS
    */

    html =
        html.replace(
            /(<li>.*?<\/li>(?:\s*<li>.*?<\/li>)*)/gs,
            "<ul>$1</ul>"
        );


    /*
    LINE BREAKS
    */

    html =
        html.replace(
            /\n/g,
            "<br>"
        );


    /*
    CLEAN EXTRA BREAKS
    */

    html =
        html.replace(
            /<br><ul>/g,
            "<ul>"
        );

    html =
        html.replace(
            /<\/ul><br>/g,
            "</ul>"
        );


    return html;

}
    /* =====================================================
   CLEAN AI RESPONSE FORMAT
===================================================== */

function formatAIResponse(text) {

    if (!text) {
        return "";
    }

    let formatted =
        String(text);


    /*
    Remove Markdown headings
    */

    formatted =
        formatted.replace(
            /^#{1,6}\s+/gm,
            ""
        );


    /*
    Remove bold Markdown
    */

    formatted =
        formatted.replace(
            /\*\*(.*?)\*\*/g,
            "$1"
        );


    /*
    Remove italic Markdown
    */

    formatted =
        formatted.replace(
            /\*(.*?)\*/g,
            "$1"
        );


    /*
    Remove Markdown horizontal lines
    */

    formatted =
        formatted.replace(
            /^---+$/gm,
            ""
        );


    /*
    Fix excessive empty lines
    */

    formatted =
        formatted.replace(
            /\n{3,}/g,
            "\n\n"
        );


    return formatted.trim();

}
    /* =====================================================

===================================================== */

function addLocalMessage(
    sender,
    text
) {

        );

    }


    const message =
        document.createElement("div");


    message.className =

            sender === "user"
                ? "user"
                : "ai"
        );


    const messageText =
        document.createElement("div");

    messageText.className =
        "messageText";

    if (sender === "ai") {

    messageText.innerHTML =
        formatAIMessage(text);

} else {

    const cleanText =
    sender === "ai"
        ? formatAIResponse(text)
        : String(text || "");

messageText.textContent =
    cleanText;

}


    const messageTime =
        document.createElement("div");

    messageTime.className =
        "messageTime";

    messageTime.textContent =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",

    message.appendChild(
        messageText
    );

    message.appendChild(
        messageTime
    );

    chatBox.appendChild(
        message
    );

    chatBox.scrollTop =
        chatBox.scrollHeight;


    return message;

}

/* =====================================================
   ADD ATTACHMENT MESSAGE
===================================================== */

function addAttachmentMessage(
    sender,
    file,
    type
) {

    if (
        !chatBox ||
        !file
    ) {
        return null;
    }


    const message =
        document.createElement("div");


    message.className =
        "message " +
        (
            sender === "user"
                ? "user"
                : "ai"
        );


    const messageText =
        document.createElement("div");

    messageText.className =
        "messageText";


    /*
    IMAGE
    */

    if (type === "image") {

        const image =
            document.createElement("img");

        image.className =
            "chatAttachmentImage";

        image.src =
            URL.createObjectURL(file);

        image.alt =
            file.name;


        image.onload =
            function () {

                chatBox.scrollTop =
                    chatBox.scrollHeight;

            };


        messageText.appendChild(
            image
        );


        const fileName =
            document.createElement("div");

        fileName.className =
            "chatAttachmentName";

        fileName.textContent =
            "🖼️ " + file.name;


        messageText.appendChild(
            fileName
        );

    }


    /*
    FILE
    */

    else {

        const fileBox =
            document.createElement("div");

        fileBox.className =
            "chatFileAttachment";


        const icon =
            document.createElement("div");

        icon.className =
            "chatFileIcon";

        icon.textContent =
            "📄";


        const fileInfo =
            document.createElement("div");

        fileInfo.className =
            "chatFileInfo";


        const fileName =
            document.createElement("div");

        fileName.className =
            "chatAttachmentName";

        fileName.textContent =
            file.name;


        const fileType =
            document.createElement("div");

        fileType.className =
            "chatAttachmentType";

        fileType.textContent =
            file.type ||
            "File";


        fileInfo.appendChild(
            fileName
        );

        fileInfo.appendChild(
            fileType
        );

        fileBox.appendChild(
            icon
        );

        fileBox.appendChild(
            fileInfo
        );

        messageText.appendChild(
            fileBox
        );

    }


    const messageTime =
        document.createElement("div");

    messageTime.className =
        "messageTime";

    messageTime.textContent =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    message.appendChild(
        messageText
    );

    message.appendChild(
        messageTime
    );

    chatBox.appendChild(
        message
    );

    chatBox.scrollTop =
        chatBox.scrollHeight;


    return message;

}

/* =====================================================
   SAVE IMAGE ATTACHMENT
===================================================== */

function saveImageAttachment(file) {

    if (!file) {
        return;
    }


    console.log(
        "🖼️ Image selected:",
        file.name
    );


    window.aiAttachment = {

        type: "image",

        name: file.name,

        mimeType: file.type,

        size: file.size,

        file: file,

        data: file

    };


    window.uploadedFiles.push({

        name: file.name,

        type:
            file.type || "image",

        size: file.size,

        uploadedAt:
            new Date().toISOString()

    });


    /*
    SHOW PREVIEW ONCE
    */

    showAttachmentPreview(
        file,
        "image"
    );


    /*
    SHOW IMAGE IN CHAT ONCE
    */

    const attachmentMessage =
        addAttachmentMessage(
            "user",
            file,
            "image"
        );


    console.log(
        "🖼️ Image added:",
        attachmentMessage
    );

}


/* =====================================================
   SAVE FILE ATTACHMENT
===================================================== */

function saveFileAttachment(file) {

    if (!file) {
        return;
    }


    console.log(
        "📄 File selected:",
        file.name
    );


    window.aiAttachment = {

        type: "file",

        name: file.name,

        mimeType: file.type,

        size: file.size,

        file: file

    };


    window.uploadedFiles.push({

        name: file.name,

        type:
            file.type ||
            "application/octet-stream",

        size: file.size,

        uploadedAt:
            new Date().toISOString()

    });


    showAttachmentPreview(
        file,
        "file"
    );


    addAttachmentMessage(
        "user",
        file,
        "file"
    );

}

/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

    console.log(
        "🔥 SEND BUTTON PRESSED"
    );


    if (!userInput) {

        console.error(
            "❌ userInput not found"
        );

        return;

    }


    let message =
        userInput.value.trim();


    const attachment =
        window.aiAttachment;


    /*
    AUTO COMMAND FOR ATTACHMENT
    */

    if (
        !message &&
        attachment
    ) {

        if (
            attachment.type === "image"
        ) {

            message =
                "describe the image";

        } else {

            message =
                "summarize the file";

        }

    }


    if (!message) {

        userInput.focus();

        return;

    }


    /*
    SHOW USER MESSAGE
    */

    addLocalMessage(
        "user",
        message
    );


    userInput.value = "";

    userInput.style.height =
        "auto";


    /*
    SHOW THINKING
    */

    const thinking =
        addLocalMessage(
            "ai",
            "🧠 Thinking..."
        );


    try {

        /*
        SMART AI
        */

        if (
            typeof window.smartAIReply !==
            "function"
        ) {

            throw new Error(
                "smartAIReply is not available"
            );

        }


        console.log(
            "🧠 Sending to smartAI..."
        );


        const response =
            await window.smartAIReply(
                message
            );


        if (thinking) {

            thinking.remove();

        }


        addLocalMessage(
            "ai",
            response ||
            "🤖 I don't have an answer yet."
        );


        /*
        REMOVE ATTACHMENT
        AFTER AI REPLIES
        */

        removeCurrentAttachment();

    }

    catch (error) {

        console.error(
            "❌ SEND ERROR:",
            error
        );


        if (thinking) {

            thinking.remove();

        }


        addLocalMessage(
            "ai",
            "⚠️ Something went wrong while processing your message."
        );

    }

}


window.sendMessage =
    sendMessage;


/* =====================================================
   SEND BUTTON
===================================================== */

if (sendBtn) {

    sendBtn.addEventListener(
        "click",
        function (event) {

            event.preventDefault();

            event.stopPropagation();

            sendMessage();

        }
    );


    console.log(
        "✅ Send button connected"
    );

} else {

    console.error(
        "❌ sendBtn NOT FOUND"
    );

}


/* =====================================================
   ENTER KEY
===================================================== */

if (userInput) {

    userInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );

}


/* =====================================================
   AUTO RESIZE
===================================================== */

if (userInput) {

    userInput.addEventListener(
        "input",
        function () {

            this.style.height =
                "auto";


            this.style.height =
                Math.min(
                    this.scrollHeight,
                    140
                ) + "px";

        }
    );

}


/* =====================================================
   CLOSE MENU OUTSIDE
===================================================== */

document.addEventListener(
    "click",
    function (event) {

        if (
            attachmentMenu &&
            attachBtn &&
            !attachmentMenu.contains(
                event.target
            ) &&
            !attachBtn.contains(
                event.target
            )
        ) {

            closeAttachmentMenu();

        }

    }
);


/* =====================================================
   WELCOME NAME
===================================================== */

const savedName =
    localStorage.getItem(
        "profileName"
    );


const welcomeName =
    document.getElementById(
        "welcomeName"
    );


if (
    welcomeName &&
    savedName
) {

    welcomeName.textContent =
        savedName;

}
